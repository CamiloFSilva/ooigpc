[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ooigpc"
version = "0.1.0"
description = "Output-only identification of thermoacoustic systems using polynomial chaos expansions"
authors = [{ name = "Camilo F. Silva", email = "camilo.silva@tum.de" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["thermoacoustics", "polynomial chaos", "system identification", "combustion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
