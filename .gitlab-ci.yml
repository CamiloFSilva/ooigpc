# Serve the pre-built Marimo WASM demo via GitLab Pages.
# Live at: https://tfd.pages.lrz.de/ooigpc
#
# The WASM files in docs/ were generated locally with:
#   marimo export html-wasm marimo/igpc_demo.py -o docs/index.html --mode run

pages:
  script:
    - cp -r docs public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
